---
# Hermes Agent — AI gateway. A VM rather than an LXC because the agent runs
# arbitrary code as a passwordless-sudo user, so it wants a kernel boundary
# rather than a shared one. Sized to match the old custom mait-gateway VM it
# replaces (6 vCPU / 12 GiB).
#
# No extra mounts, and no persistence: the agent's skills, memories, sessions,
# board and state databases all live on the rootfs and are lost on a rebuild.
# Take a `hermes backup` first — see the hermes_agent role README. The 250 GiB
# rootfs (on the ZFS zpool via local-zpool storage) gives the agent room for
# docker image layers, build scratch and incidental artefacts.
terraform:
  vmid: 217
  hostname: hermes
  ip_address: 10.20.1.217/16
  nameserver: 10.20.0.1
  cpu_core_count: 6
  memory: 12288
  start_on_boot: true
  rootfs_size: 250G

ansible:
  roles:
    - base
    - docker
    - hermes_agent
