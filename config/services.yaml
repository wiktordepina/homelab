---
# The homelab service catalogue: one entry per name published under
# homelab.matagoth.com. Three consumers derive from this file — the DNS A
# records (terraform/dns), the reverse-proxy server blocks (the
# nginx_reverse_proxy role) and the index dashboard (the homepage stack) — so a
# service is added here once rather than in each of them separately.
#
# See docs/reference/service-catalogue.md for the schema.

categories:
  - name: infrastructure
    title: Infrastructure
    description: The hypervisor, the network fabric, and the tooling that records both
    subcategories:
      - name: platform
        title: Platform
      - name: network
        title: Network
      - name: management
        title: Management

  - name: observability
    title: Observability
    description: What the homelab is doing, and how it says so
    subcategories:
      - name: metrics
        title: Metrics
      - name: notifications
        title: Notifications

  - name: media
    title: Media
    description: The library and the machinery that fills it
    subcategories:
      - name: library
        title: Library
      - name: acquisition
        title: Acquisition
      - name: downloads
        title: Downloads

  - name: automation
    title: Automation
    description: Home automation and workflow orchestration
    subcategories:
      - name: home
        title: Home
      - name: workflows
        title: Workflows

  - name: ai
    title: AI
    description: Model inference and the agents built on top of it
    subcategories:
      - name: inference
        title: Inference
      - name: agents
        title: Agents

services:
  # --- infrastructure ---------------------------------------------------
  - name: www
    title: Homepage
    category: infrastructure
    subcategory: management
    upstream: http://10.20.1.205:3000/
    description: This dashboard
    icon: mdi-home
    # The index does not list itself.
    listed: false

  - name: proxmox
    title: Proxmox VE
    category: infrastructure
    subcategory: platform
    upstream: https://192.168.200.100:8006/
    description: Hypervisor, container and VM management
    icon: proxmox

  - name: fileserver
    title: Cockpit
    category: infrastructure
    subcategory: platform
    upstream: https://10.20.1.203:9090/
    description: File server host administration
    icon: cockpit

  - name: opnsense
    title: OPNsense
    category: infrastructure
    subcategory: network
    upstream: https://192.168.200.1/
    description: Router, firewall and VLAN termination
    icon: opnsense

  - name: switch
    title: Switch
    category: infrastructure
    subcategory: network
    upstream: http://192.168.200.50/
