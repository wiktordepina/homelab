---
services:
  netalertx:
    image: ghcr.io/jokob-sk/netalertx:26.10.24
    container_name: netalertx
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - NET_BIND_SERVICE
    environment:
      - TZ=Europe/London
      - PORT=20211
      # Host networking puts the UI on every VLAN 213 scans, IoT and management
      # included; only the reverse proxy needs it, on the fleet address.
      - LISTEN_ADDR=10.20.1.213
    volumes:
      - /mnt/netalertx:/data
      - /etc/localtime:/etc/localtime:ro
