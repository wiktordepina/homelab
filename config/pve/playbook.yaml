---
- name: PVE Extras
  hosts: 192.168.200.100
  roles:
    - role: zfs_snapshots
      vars:
        zfs_snapshots_datasets:
          - name: zpool/secrets
            mode: on-change
            keep: 5
          - name: zpool/terraform
            mode: daily
            keep: 5
    - telegraf
    # gpu_drivers paused: PVE now boots kernel 7.0 and the Tesla 535 DKMS
    # module has only been built for 6.x. Re-running the role would try that
    # build on the hypervisor. No guest uses the GPU meanwhile.
    # - gpu_drivers
