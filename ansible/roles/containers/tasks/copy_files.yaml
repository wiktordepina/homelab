---
- name: "Create base directory for {{ container.name }}"
  ansible.builtin.file:
    path: "/containers/{{ container.name }}"
    state: directory
  when: container.state == "up"

- name: "Create directories for {{ container.name }}"
  ansible.builtin.file:
    path: "/containers/{{ container.name }}/{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  with_community.general.filetree: "../../../config/docker/{{ container.name }}/"
  when: item.state == "directory" and container.state == "up"

# Every file in a stack directory is rendered as a template, so a `.j2` suffix
# is not what makes templating happen — it exists for files whose Jinja is not
# also valid YAML, which yamllint would otherwise reject. The suffix is stripped
# on the way out so the stack sees the filename it expects.
- name: "Render templates for {{ container.name }}"
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/containers/{{ container.name }}/{{ item.path | regex_replace('\\.j2$', '') }}"
    mode: "{{ item.mode }}"
  with_community.general.filetree: "../../../config/docker/{{ container.name }}/"
  when: item.state == "file" and container.state == "up"
  register: container_templates

# `docker compose up -d` only recreates a container when the compose file
# changes, so a stack whose configuration lives in bind-mounted files keeps
# serving whatever it read at startup — the config on disk is current and the
# running container is not. Collect the stacks that need a restart; main.yaml
# performs it after the images and containers have settled.
- name: "Note that {{ container.name }} needs restarting"
  ansible.builtin.set_fact:
    containers_needing_restart: >-
      {{ (containers_needing_restart | default([])) + [container.name] }}
  when:
    - container.state == "up"
    - container_templates is changed
