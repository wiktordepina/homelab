---
- name: Require the forge-deploy token
  ansible.builtin.assert:
    that:
      - maitre_d_forge_token is match('^[0-9a-f]{40}$')
    fail_msg: >-
      MAITRE_D_FORGE_TOKEN must be exported from /pve/secrets/maitre_d.sh on the
      apply runner as 40 hexadecimal characters. See post-deploy-setup for how
      forge-deploy's token is minted.
    quiet: true

- name: Create the install directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: "{{ maitre_d_user }}"
    mode: '0750'
  loop:
    - "{{ maitre_d_install_dir }}"
    - "{{ maitre_d_install_dir }}/bin"
    - "{{ maitre_d_config_dir }}"

- name: Fetch uv
  ansible.builtin.get_url:
    url: "https://github.com/astral-sh/uv/releases/download/{{ maitre_d_uv_version }}/uv-x86_64-unknown-linux-gnu.tar.gz"
    dest: "/usr/local/src/uv-{{ maitre_d_uv_version }}.tar.gz"
    checksum: "sha256:{{ maitre_d_uv_sha256 }}"
    owner: root
    group: root
    mode: '0644'

- name: Install uv
  ansible.builtin.unarchive:
    src: "/usr/local/src/uv-{{ maitre_d_uv_version }}.tar.gz"
    dest: "{{ maitre_d_install_dir }}/bin"
    remote_src: true
    extra_opts: [--strip-components=1]
    include:
      - uv-x86_64-unknown-linux-gnu/uv
    owner: root
    group: root
    mode: '0755'

- name: Read the checked-out commit
  ansible.builtin.command:
    argv: [git, -C, "{{ maitre_d_src_dir }}", rev-parse, HEAD]
  register: maitre_d_head
  changed_when: false
  failed_when: false

# A fresh shallow clone of the tag whenever the commit differs, so nothing from
# an earlier checkout survives. The token goes in through git's environment,
# never argv (every process's command line is readable by the agent) and never
# the remote URL (it would be saved in .git/config).
- name: Fetch the pinned release
  when: maitre_d_head.stdout != maitre_d_commit
  block:
    - name: Remove the previous checkout
      ansible.builtin.file:
        path: "{{ maitre_d_src_dir }}"
        state: absent

    - name: Clone the release tag
      ansible.builtin.command:
        argv:
          - git
          - clone
          - --quiet
          - --depth=1
          - "--branch=v{{ maitre_d_version }}"
          - "{{ maitre_d_repo_url }}"
          - "{{ maitre_d_src_dir }}"
      environment: "{{ claude_workstation_proxy_env | combine({
        'GIT_CONFIG_COUNT': '1',
        'GIT_CONFIG_KEY_0': 'http.extraHeader',
        'GIT_CONFIG_VALUE_0': 'Authorization: token ' ~ maitre_d_forge_token}) }}"
      no_log: true
      changed_when: true
      notify: Restart maitre-d

- name: Check the checkout is the pinned commit
  ansible.builtin.command:
    argv: [git, -C, "{{ maitre_d_src_dir }}", rev-parse, HEAD]
  register: maitre_d_head_after
  changed_when: false
  failed_when: maitre_d_head_after.stdout != maitre_d_commit

# The workstation agent's identity, from the pinned release, as Claude Code's
# managed memory: loaded first in every session, not excludable by user
# settings, and not the agent's to write. Overwritten, never merged; the
# repository is the only source. Concatenated rather than @-imported, because
# the docs do not say imports work from managed memory.
- name: Read the agent's identity
  ansible.builtin.slurp:
    src: "{{ maitre_d_src_dir }}/identity/{{ item }}.md"
  loop: "{{ maitre_d_identity_files }}"
  register: maitre_d_identity

- name: Install the identity as managed memory
  ansible.builtin.copy:
    content: "{{ maitre_d_identity.results | map(attribute='content') | map('b64decode') | join('\n') }}"
    dest: /etc/claude-code/CLAUDE.md
    owner: root
    group: root
    mode: '0644'

# mait-code's own copies, which the agent's ~/.claude/CLAUDE.md imports. mait-code
# replaces a file only while it is byte-identical to a template it shipped, so
# an update leaves the stubs alone.
- name: Retire mait-code's identity copies
  ansible.builtin.copy:
    content: "Superseded by the managed CLAUDE.md (/etc/claude-code/CLAUDE.md).\n"
    dest: "{{ maitre_d_agent_data_dir }}/{{ item }}.md"
    owner: "{{ claude_workstation_user }}"
    group: "{{ maitre_d_data_group }}"
    mode: '0644'
  loop: "{{ maitre_d_identity_files }}"

# maitre-d and the agent open the same databases, and mait-code refuses one on
# another schema version, so the two installs must be the same release.
- name: Read the mait-code release maitre-d is locked to
  ansible.builtin.slurp:
    src: "{{ maitre_d_src_dir }}/uv.lock"
  register: maitre_d_lock

- name: Check it matches the agent's mait-code
  vars:
    maitre_d_mait_code_ref: >-
      {{ maitre_d_lock.content | b64decode
         | regex_search('mait-code\?rev=(v[0-9.]+)', '\1') | first }}
  ansible.builtin.assert:
    that:
      - maitre_d_mait_code_ref == claude_workstation_mait_code_ref
    fail_msg: >-
      maitre-d v{{ maitre_d_version }} is locked to mait-code {{ maitre_d_mait_code_ref }},
      but the agent runs {{ claude_workstation_mait_code_ref }}. Move
      claude_workstation_mait_code_ref and the maitre-d release together.
    quiet: true

- name: Read the installed maitred version
  ansible.builtin.command:
    argv: ["{{ maitre_d_venv_dir }}/bin/maitred", version]
  register: maitre_d_installed
  changed_when: false
  failed_when: false

# Root goes out directly, so PyPI and mait-code's GitHub source need nothing on
# squid's list. The system Python, and no interpreter downloads.
- name: Install maitre-d and its locked dependencies
  when: maitre_d_installed.stdout | trim != maitre_d_version
  ansible.builtin.command:
    argv:
      - "{{ maitre_d_uv }}"
      - sync
      - --frozen
      - --no-dev
      - --no-editable
    chdir: "{{ maitre_d_src_dir }}"
  environment:
    UV_PROJECT_ENVIRONMENT: "{{ maitre_d_venv_dir }}"
    UV_PYTHON: "{{ maitre_d_python }}"
    UV_PYTHON_DOWNLOADS: never
    UV_CACHE_DIR: /var/cache/maitre-d-uv
  changed_when: true
  notify: Restart maitre-d

- name: Check the installed version
  ansible.builtin.command:
    argv: ["{{ maitre_d_venv_dir }}/bin/maitred", version]
  register: maitre_d_installed_after
  changed_when: false
  failed_when: maitre_d_installed_after.stdout | trim != maitre_d_version

- name: Create the runner's directory
  ansible.builtin.file:
    path: "{{ maitre_d_runner_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

# The SDK's import as well as the version, so an install that died part-way is
# redone rather than taken as current.
- name: Read the installed runner version
  ansible.builtin.command:
    argv:
      - "{{ maitre_d_runner_venv_dir }}/bin/python"
      - -c
      - "import importlib.metadata as m, claude_agent_sdk; print(m.version('maitre-d-runner'))"
  register: maitre_d_runner_installed
  changed_when: false
  failed_when: false

# Only the runner's package and what it locks: the contract and the SDK with its
# bundled CLI, nothing of maitred's. A job already running keeps the files it
# opened; the next one starts on the new release.
- name: Install the workflow runner
  when: maitre_d_runner_installed.stdout | trim != maitre_d_version
  ansible.builtin.command:
    argv:
      - "{{ maitre_d_uv }}"
      - sync
      - --frozen
      - --no-dev
      - --no-editable
      - --package
      - maitre-d-runner
    chdir: "{{ maitre_d_src_dir }}"
  environment:
    UV_PROJECT_ENVIRONMENT: "{{ maitre_d_runner_venv_dir }}"
    # The agent cannot write __pycache__ here, so without this every job compiles
    # the lot again in memory.
    UV_COMPILE_BYTECODE: "1"
    UV_PYTHON: "{{ maitre_d_python }}"
    UV_PYTHON_DOWNLOADS: never
    UV_CACHE_DIR: /var/cache/maitre-d-uv
  changed_when: true

- name: Check the installed runner version
  ansible.builtin.command:
    argv:
      - "{{ maitre_d_runner_venv_dir }}/bin/python"
      - -c
      - "import importlib.metadata as m, claude_agent_sdk; print(m.version('maitre-d-runner'))"
  register: maitre_d_runner_installed_after
  changed_when: false
  failed_when: maitre_d_runner_installed_after.stdout | trim != maitre_d_version

# uv makes its lock world-writable so other users can take it. Nobody but root
# syncs this venv, and an agent holding the lock would stall the next converge.
- name: Close the venv's lock to the agent
  ansible.builtin.file:
    path: "{{ maitre_d_runner_venv_dir }}/.lock"
    state: file
    owner: root
    group: root
    mode: '0644'

# The agent runs the runner and the CLI it drives, so neither may be the
# agent's to change: anything not root's, or writable beyond root, fails.
- name: Check the agent cannot change the runner
  ansible.builtin.command:
    argv: [find, "{{ maitre_d_runner_dir }}", "!", -type, l, "(", "!", -user, root, -o, -perm, /022, ")", -print]
  register: maitre_d_runner_writable
  changed_when: false
  failed_when: maitre_d_runner_writable.stdout | length > 0

# The agent's mait-code databases: maitre-d reads them all and writes the board.
# The directory is setgid so files the agent creates later join the group, and
# SQLite gives each -wal and -shm the mode and group of its database.
- name: Create the shared data group
  ansible.builtin.group:
    name: "{{ maitre_d_data_group }}"
    system: true

# Both, not only maitre-d: whichever side opens a database first creates its
# -wal and -shm, owned by that side, so the other needs the group to write. The
# agent's sessions pick the group up when their units next start.
- name: Put maitre-d and the agent in the shared data group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ maitre_d_data_group }}"
    append: true
  loop:
    - "{{ maitre_d_user }}"
    - "{{ claude_workstation_user }}"
  notify: Restart maitre-d

- name: Share the agent's mait-code data directory
  ansible.builtin.file:
    path: "{{ maitre_d_agent_data_dir }}"
    state: directory
    owner: "{{ claude_workstation_user }}"
    group: "{{ maitre_d_data_group }}"
    mode: '2775'

- name: Share the agent's mait-code databases
  ansible.builtin.shell:
    cmd: |
      set -eu
      cd '{{ maitre_d_agent_data_dir }}'
      for f in *.db *.db-wal *.db-shm; do
        [ -e "$f" ] || continue
        if [ "$(stat -c %G:%a "$f")" != '{{ maitre_d_data_group }}:664' ]; then
          chgrp '{{ maitre_d_data_group }}' "$f"
          chmod 0664 "$f"
          echo "CHANGED $f"
        fi
      done
    executable: /bin/bash
  register: maitre_d_share
  changed_when: "'CHANGED' in maitre_d_share.stdout"

# Read without search: maitre-d lists the names (and each entry's type) and the
# kernel resolves no path beneath. Hardening only: the agent owns the directory
# and can widen the mode until the next converge, so maitre-d's own code is what
# keeps it from following links there. Not setgid: checkouts stay out of the group.
- name: Let maitre-d list the agent's work directory
  ansible.builtin.file:
    path: "{{ maitre_d_work_dir }}"
    state: directory
    owner: "{{ claude_workstation_user }}"
    group: "{{ maitre_d_data_group }}"
    mode: '0740'

# The release's telemetry/ as it stands, replaced whole when it differs so no
# file from an earlier release survives. World-readable: every session loads it.
- name: Install the session-telemetry mod
  ansible.builtin.shell:
    cmd: |
      set -eu
      src='{{ maitre_d_src_dir }}/telemetry'
      dst='{{ maitre_d_mods_dir }}'
      if ! diff -r --no-dereference "$src" "$dst" > /dev/null 2>&1; then
        rm -rf "$dst"
        install -d -o root -g root -m 0755 "$(dirname "$dst")"
        cp -r --no-preserve=all "$src" "$dst"
        chmod -R u=rwX,go=rX "$dst"
        echo CHANGED
      fi
    executable: /bin/bash
  register: maitre_d_mod
  changed_when: "'CHANGED' in maitre_d_mod.stdout"

# Under allowManagedHooksOnly, a mod loads only from a managed marketplace with
# a directory source at an absolute path.
- name: Create the managed settings drop-in directory
  ansible.builtin.file:
    path: /etc/claude-code/managed-settings.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Make the mod the organisation's
  ansible.builtin.copy:
    dest: /etc/claude-code/managed-settings.d/50-session-telemetry.json
    content: "{{ {
      'extraKnownMarketplaces': {'maitre-d': {'source': {'source': 'directory', 'path': maitre_d_mods_dir}}},
      'enabledPlugins': {'session-telemetry@maitre-d': true}
      } | to_nice_json(indent=2) }}\n"
    owner: root
    group: root
    mode: '0644'

# tmpfiles creates the directory at boot and ages out the files. The agent's
# sessions create them through the group; setgid keeps them in it.
- name: Keep the telemetry directory and age out its files
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/claude-telemetry.conf
    content: |
      d {{ maitre_d_telemetry_dir }} 2770 root {{ maitre_d_data_group }} {{ maitre_d_telemetry_max_age }}
    owner: root
    group: root
    mode: '0644'

- name: Create the telemetry directory
  ansible.builtin.file:
    path: "{{ maitre_d_telemetry_dir }}"
    state: directory
    owner: root
    group: "{{ maitre_d_data_group }}"
    mode: '2770'

# The directory in the same place as the permission to write it. A session
# started outside these units falls back to the mod's default under $HOME.
# Units already running keep their old sandbox until they next start.
- name: Create the session units' drop-in directories
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.service.d"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - claude-rc@
    - claude-job@

- name: Let the session units write telemetry
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item }}.service.d/telemetry.conf"
    content: |
      [Service]
      Environment=MAITRED_TELEMETRY_DIR={{ maitre_d_telemetry_dir }}
      ReadWritePaths={{ maitre_d_telemetry_dir }}
    owner: root
    group: root
    mode: '0644'
  loop:
    - claude-rc@
    - claude-job@
  notify: Reload systemd

- name: Template the config
  ansible.builtin.template:
    src: maitred.toml.j2
    dest: "{{ maitre_d_config_file }}"
    owner: root
    group: "{{ maitre_d_user }}"
    mode: '0640'
  notify: Restart maitre-d

- name: Create maitre-d's mait-code and config homes
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ maitre_d_user }}"
    group: "{{ maitre_d_user }}"
    mode: '0700'
  loop:
    - "{{ maitre_d_data_dir }}/mait-code"
    - "{{ maitre_d_data_dir }}/xdg"

# maitred loads the model before it serves; downloading it here keeps the first
# start quick and a failed download visible in the converge. Through squid, as
# maitre-d has no direct way out.
- name: Download the embedding model into maitre-d's cache
  ansible.builtin.command:
    argv:
      - "{{ maitre_d_venv_dir }}/bin/python"
      - -c
      - |
        import sys
        from mait_code.tools.memory.embeddings import get_provider
        sys.exit(0 if get_provider() is not None else 1)
    creates: "{{ maitre_d_data_dir }}/mait-code/models/models--{{ maitre_d_embedding_model | replace('/', '--') }}"
  become: true
  become_user: "{{ maitre_d_user }}"
  environment: "{{ claude_workstation_proxy_env | combine(maitre_d_env) }}"
  when: maitre_d_embedding_provider == 'local'

- name: Install the service unit
  ansible.builtin.template:
    src: maitre-d.service.j2
    dest: /etc/systemd/system/maitre-d.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart maitre-d

- name: Enable and start maitre-d
  ansible.builtin.systemd_service:
    name: maitre-d
    daemon_reload: true
    enabled: true
    state: started

# A converge that failed after an install loses its queued restart, and the next
# one finds nothing to install, so the old release would keep serving. Asked of
# the service itself: one not listening yet has only just started.
- name: Read the running version
  ansible.builtin.uri:
    url: "http://{{ maitre_d_host }}:{{ maitre_d_port }}/healthz"
  register: maitre_d_running
  failed_when: false
  changed_when:
    - maitre_d_running.status == 200
    - maitre_d_running.json.version != maitre_d_version
  notify: Restart maitre-d

- name: Apply restarts
  ansible.builtin.meta: flush_handlers

# The model loads before maitred listens, so give it time.
- name: Wait for /healthz
  ansible.builtin.uri:
    url: "http://{{ maitre_d_host }}:{{ maitre_d_port }}/healthz"
    return_content: true
  register: maitre_d_health
  until: maitre_d_health.status == 200
  retries: 30
  delay: 5

# provider-failed is the one reason the converge can cause: a model download
# that never finished. The others (no vectors yet, say) are the agent's to fix.
- name: Check the running version and the embedding model
  ansible.builtin.assert:
    that:
      - maitre_d_health.json.version == maitre_d_version
      - maitre_d_health.json.get('memory_search_reason') != 'provider-failed'
    fail_msg: >-
      /healthz reports version {{ maitre_d_health.json.version }} (expected
      {{ maitre_d_version }}), memory search {{ maitre_d_health.json.memory_search }}
      ({{ maitre_d_health.json.get('memory_search_reason') }}). provider-failed means the
      model did not load: remove {{ maitre_d_data_dir }}/mait-code/models and converge.
    quiet: true
