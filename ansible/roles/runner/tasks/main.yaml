---
- name: Require a runner name
  ansible.builtin.assert:
    that:
      - runner_name | length > 0
    fail_msg: >-
      runner_name must be set in this container's config/lxc/<vmid>.yaml,
      as github-runner-<vmid>.
    quiet: true

# The mounts are made when the container is created, not by this role. A
# runner without them registers and takes jobs, then fails every one of them
# on a missing secret or state file, so refuse to build one at all.
- name: Check the secrets and state mounts
  ansible.builtin.command: mountpoint -q {{ item }}
  loop:
    - "{{ runner_secrets_dir }}"
    - "{{ runner_state_dir }}"
  register: runner_mounts
  changed_when: false
  failed_when: false

- name: Require the secrets and state mounts
  ansible.builtin.assert:
    that:
      - runner_mounts.results | map(attribute='rc') | select('ne', 0) | list | length == 0
    fail_msg: >-
      {{ runner_secrets_dir }} and {{ runner_state_dir }} must be bind mounts
      of /zpool/secrets and /zpool/terraform on PVE. They are declared when the
      container is created; see the create-runner runbook.
    quiet: true

- name: Check the runner SSH key
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ runner_ssh_key }}"
    - "{{ runner_ssh_key }}.pub"
  register: runner_key_files

- name: Require the runner SSH key
  ansible.builtin.assert:
    that:
      - runner_key_files.results | rejectattr('stat.exists') | list | length == 0
    fail_msg: >-
      {{ runner_ssh_key }} and its .pub must exist in the secrets store, mode
      0644 so the unprivileged container can read them.
    quiet: true

- name: Install runner host dependencies
  # git because actions/checkout falls back to the REST API without it, which
  # produces a tree with no history and no .git.
  ansible.builtin.apt:
    name:
      - curl
      - git
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create runner user
  # In the docker group because run/execute_runner starts the toolbox as this
  # user.
  ansible.builtin.user:
    name: "{{ runner_user }}"
    groups:
      - docker
    append: true
    home: "{{ runner_home }}"
    shell: /bin/bash
    create_home: true

- name: Create runner .ssh directory
  ansible.builtin.file:
    path: "{{ runner_home }}/.ssh"
    state: directory
    owner: "{{ runner_user }}"
    group: "{{ runner_user }}"
    mode: '0700'

# The store's copy is 0644 because an unprivileged container can only read
# it through the world bit, and ssh ignores a private key that loose.
- name: Install the runner SSH key
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ runner_home }}/.ssh/{{ item.dest }}"
    remote_src: true
    owner: "{{ runner_user }}"
    group: "{{ runner_user }}"
    mode: "{{ item.mode }}"
  loop:
    - { src: "{{ runner_ssh_key }}", dest: id_rsa, mode: '0600' }
    - { src: "{{ runner_ssh_key }}.pub", dest: id_rsa.pub, mode: '0644' }
  loop_control:
    label: "{{ item.dest }}"

# Ansible checks host keys by default, and a freshly provisioned container
# has one nobody has seen, so without this every first converge fails.
#
# Owned by root although it sits in the runner's home: run/execute_runner
# mounts this directory into the toolbox as /root/.ssh, and ssh running as
# root rejects a config owned by any other non-root user.
- name: Install runner SSH config
  ansible.builtin.template:
    src: ssh_config.j2
    dest: "{{ runner_home }}/.ssh/config"
    owner: root
    group: root
    mode: '0644'

- name: Check for an installed runner
  ansible.builtin.stat:
    path: "{{ runner_dir }}/config.sh"
  register: runner_installed

- name: Install the Actions runner
  when: not runner_installed.stat.exists
  block:
    - name: Create runner directory
      ansible.builtin.file:
        path: "{{ runner_dir }}"
        state: directory
        owner: "{{ runner_user }}"
        group: "{{ runner_user }}"
        mode: '0755'

    - name: Download the Actions runner
      ansible.builtin.get_url:
        url: >-
          https://github.com/actions/runner/releases/download/v{{ runner_version }}/actions-runner-linux-x64-{{ runner_version }}.tar.gz
        dest: /tmp/actions-runner.tar.gz
        checksum: "{{ runner_checksum }}"
        mode: '0644'

    - name: Unpack the Actions runner
      ansible.builtin.unarchive:
        src: /tmp/actions-runner.tar.gz
        dest: "{{ runner_dir }}"
        remote_src: true
        owner: "{{ runner_user }}"
        group: "{{ runner_user }}"

    # Upstream's script tracks each release's library renames (trixie's t64
    # packages, successive libicu versions), which a list here would not.
    - name: Install the Actions runner's dependencies
      ansible.builtin.command: "{{ runner_dir }}/bin/installdependencies.sh"
      changed_when: true

    - name: Remove the Actions runner download
      ansible.builtin.file:
        path: /tmp/actions-runner.tar.gz
        state: absent

- name: Check for a registration
  ansible.builtin.stat:
    path: "{{ runner_dir }}/.runner"
  register: runner_registered

- name: Require a registration token for an unregistered runner
  ansible.builtin.assert:
    that:
      - runner_registered.stat.exists or runner_registration_token | length > 0
    fail_msg: >-
      This runner is not registered with GitHub. Generate a registration token
      and pass it as runner_registration_token; bootstrap/apply-runner prompts
      for one whenever the runner is unregistered.
    quiet: true

# --replace takes over an existing registration with the same name, so
# rebuilding a runner at the same VMID does not leave its old self offline in
# the list. runuser rather than become: config.sh refuses to run as root, and
# the Debian template ships neither sudo nor the acl tools become needs.
#
# The token goes in through the environment, which config.sh reads as
# ACTIONS_RUNNER_INPUT_<arg>, rather than argv. A task's environment is not
# part of its result, so the token stays out of the output without no_log,
# and a rejected token still shows GitHub's error.
- name: Register with GitHub
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - "{{ runner_user }}"
      - --
      - ./config.sh
      - --unattended
      - --replace
      - --url
      - "{{ runner_repo_url }}"
      - --name
      - "{{ runner_name }}"
    chdir: "{{ runner_dir }}"
    creates: "{{ runner_dir }}/.runner"
  environment:
    ACTIONS_RUNNER_INPUT_TOKEN: "{{ runner_registration_token }}"

- name: Install the runner service
  ansible.builtin.command:
    cmd: ./svc.sh install {{ runner_user }}
    chdir: "{{ runner_dir }}"
    creates: "{{ runner_dir }}/.service"

# svc.sh names the unit after the repository and the runner and records the
# name in .service, so read it rather than rebuild it here.
- name: Read the runner service name
  ansible.builtin.slurp:
    src: "{{ runner_dir }}/.service"
  register: runner_service_file

- name: Enable and start the runner service
  ansible.builtin.systemd_service:
    name: "{{ runner_service_file.content | b64decode | trim }}"
    state: started
    enabled: true
    daemon_reload: true

- name: Build the toolbox image
  when: runner_toolbox_src | length > 0
  block:
    - name: Check for the toolbox image
      ansible.builtin.command: docker image inspect {{ runner_toolbox_image }}
      register: runner_toolbox_present
      changed_when: false
      failed_when: false

    - name: Build the toolbox image
      ansible.builtin.command: >-
        docker build -t {{ runner_toolbox_image }} {{ runner_toolbox_src }}/runner-toolbox
      when: runner_toolbox_present.rc != 0
      changed_when: true
