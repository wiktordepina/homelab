---
# `clean` empties /var/cache/apt/archives *before* the download rather than
# after, and that ordering is the point: the upgrade gets maximum headroom at
# the one moment it needs it. VM 214 filled its 3.8G root disk mid-upgrade
# against a 968M cache accumulated over many runs, leaving a kernel unable to
# build its initramfs and a broken dpkg state. At rest the cache now holds one
# upgrade's worth rather than every upgrade ever.
- name: Update OS Packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: "yes"
    clean: true
    lock_timeout: "{{ base_apt_lock_timeout }}"

# Superseded kernels are auto-installed dependencies of linux-image-amd64, so
# autoremove is what drops them. apt 3.0 protects the booted kernel and the one
# before it, so this bounds a VM to two rather than the seven that filled 214.
# LXCs have no kernels of their own but still accumulate ordinary orphans.
- name: Remove superseded packages
  ansible.builtin.apt:
    autoremove: true
    purge: true
    lock_timeout: "{{ base_apt_lock_timeout }}"

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    lock_timeout: "{{ base_apt_lock_timeout }}"

# The packaged 50unattended-upgrades also enables the main Debian archive, so
# it would install point releases unattended as well. `#clear` drops those
# entries and leaves only the security suite; point releases still arrive
# through the upgrade above on each converge.
- name: Restrict unattended-upgrades to the security suite
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/51homelab-unattended-upgrades
    content: |
      #clear Unattended-Upgrade::Origins-Pattern;
      Unattended-Upgrade::Origins-Pattern {
        "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
      };
      Unattended-Upgrade::Automatic-Reboot "false";
    owner: root
    group: root
    mode: "0644"

- name: Enable the periodic apt runs
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::CleanInterval "7";
    owner: root
    group: root
    mode: "0644"

- name: Enable the apt timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer

# journald's default ceiling is 10% of the filesystem, which on VM 214's 3.8G
# root is more than the headroom an upgrade needs. A fixed cap bounds every
# host the same way regardless of disk size.
- name: Create journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Cap journald disk usage
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/size.conf
    content: |
      [Journal]
      SystemMaxUse=200M
    owner: root
    group: root
    mode: "0644"
  notify:
    - Restart journald

# Block of KVM-guest-only setup. Each task gates on virtualization type so
# LXCs and bare-metal hosts are unaffected.
- name: KVM guest setup
  when: ansible_facts['virtualization_type'] == "kvm"
  block:
    # qemu-guest-agent ships preinstalled on Debian generic-cloud images but
    # is not enabled on first boot. Without it running, `agent = 1` in the
    # VM's Terraform resource is a lie — Proxmox falls back to ACPI for
    # shutdowns and `qm guest cmd` fails.
    - name: Install qemu-guest-agent
      ansible.builtin.apt:
        name: qemu-guest-agent
        state: present
        lock_timeout: "{{ base_apt_lock_timeout }}"
    - name: Enable qemu-guest-agent service
      ansible.builtin.systemd:
        name: qemu-guest-agent
        enabled: true
        state: started

    # The Debian generic-cloud image we clone from ships the *cloud* kernel,
    # which is a minimised build that omits whole driver subsystems (USB,
    # most of bluetooth, several SCSI HBAs). For homelab guests with USB
    # pass-through or any non-trivial hardware, we need the full kernel.
    # Install it, purge the cloud one, and reboot if anything changed.
    - name: Install full Debian kernel
      ansible.builtin.apt:
        name: linux-image-amd64
        state: present
        lock_timeout: "{{ base_apt_lock_timeout }}"
      register: full_kernel_install
    - name: Purge cloud kernel meta-package and image
      ansible.builtin.apt:
        name:
          - linux-image-cloud-amd64
        state: absent
        purge: true
        autoremove: true
        lock_timeout: "{{ base_apt_lock_timeout }}"
      register: cloud_kernel_purge
    - name: Reboot into the full kernel
      ansible.builtin.reboot:
        msg: Switching from cloud kernel to full Debian kernel
      when: full_kernel_install.changed or cloud_kernel_purge.changed
