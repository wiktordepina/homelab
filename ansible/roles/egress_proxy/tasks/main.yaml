---
- name: Install squid and nftables
  ansible.builtin.apt:
    name:
      - squid
      - nftables
    state: present
    update_cache: true
    cache_valid_time: 3600

# nftables matches socket owners by number. Resolving the names here, rather
# than writing them into the ruleset, keeps the load from depending on how
# nft's parser treats a name like `_apt`.
- name: Read the passwd database
  ansible.builtin.getent:
    database: passwd

- name: Resolve the users the firewall names to uids
  ansible.builtin.set_fact:
    egress_proxy_squid_uid: "{{ ansible_facts.getent_passwd['proxy'][1] }}"
    egress_proxy_direct_uids: "{{ egress_proxy_direct_users | map('extract', ansible_facts.getent_passwd) | map(attribute='1') | list }}"

- name: Resolve the NTP user to a uid
  ansible.builtin.set_fact:
    egress_proxy_ntp_uid: "{{ ansible_facts.getent_passwd[egress_proxy_ntp_user][1] }}"
  when: egress_proxy_ntp_user | length > 0

- name: Template the squid allowlist
  ansible.builtin.copy:
    content: |
      {% for name in egress_proxy_allowlist %}
      {{ name }}
      {% endfor %}
    dest: /etc/squid/allowlist.txt
    owner: root
    group: root
    mode: '0644'
  notify: Reload squid

- name: Template squid config
  ansible.builtin.template:
    src: squid.conf.j2
    dest: /etc/squid/squid.conf
    owner: root
    group: root
    mode: '0644'
    validate: squid -k parse -f %s
  notify: Reload squid

- name: Create the nftables include directory
  ansible.builtin.file:
    path: "{{ egress_proxy_nft_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Template the egress ruleset
  ansible.builtin.template:
    src: egress.nft.j2
    dest: "{{ egress_proxy_nft_file }}"
    owner: root
    group: root
    mode: '0644'
    validate: nft -c -f %s
  notify: Reload egress firewall

- name: Install the egress firewall unit
  ansible.builtin.template:
    src: egress-firewall.service.j2
    dest: /etc/systemd/system/egress-firewall.service
    owner: root
    group: root
    mode: '0644'
  notify: Reload egress firewall

- name: Enable and start squid and the egress firewall
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    daemon_reload: true
    state: started
    enabled: true
  loop:
    - squid
    - egress-firewall

# Now rather than at the end of the play: if a later task fails, a handler
# still pending is dropped, and the next converge finds the files unchanged
# and never notifies again. Squid then keeps running whatever config it
# started with, which for a fresh install is Debian's allow-from-localhost.
- name: Apply the proxy and firewall changes
  ansible.builtin.meta: flush_handlers

# The fence is only as good as the config squid has actually loaded, so test
# what it does rather than what the file says. squid refuses an off-list name
# before resolving it.
- name: Check that squid refuses a name off the allowlist
  ansible.builtin.shell:
    cmd: |
      set -eu
      exec 3<>/dev/tcp/127.0.0.1/{{ egress_proxy_port }}
      printf 'CONNECT egress-probe.invalid:443 HTTP/1.1\r\nHost: egress-probe.invalid:443\r\n\r\n' >&3
      timeout 5 head -n 1 <&3
    executable: /bin/bash
  register: egress_proxy_probe
  changed_when: false
  failed_when: "' 403 ' not in egress_proxy_probe.stdout"
  when: egress_proxy_enforce | bool
