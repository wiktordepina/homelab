---
forgejo_version: "15.0.1"

forgejo_user: git
forgejo_group: git

forgejo_data_dir: /mnt/forgejo
forgejo_config_dir: /etc/forgejo
forgejo_log_dir: /var/log/forgejo
forgejo_binary: /usr/local/bin/forgejo

forgejo_http_addr: 0.0.0.0
forgejo_http_port: 3000
forgejo_ssh_addr: 0.0.0.0
forgejo_ssh_port: 2222

forgejo_domain: forge.home.matagoth.com
forgejo_root_url: https://forge.homelab.matagoth.com/

forgejo_disable_registration: true

forgejo_actions_enabled: true
# Where a workflow's `uses:` resolves when it carries no absolute URL.
forgejo_actions_default_url: https://data.forgejo.org

# One entry per runner container, as `name` plus the `secret_env` naming the
# variable in /pve/secrets/forgejo.sh that holds its shared secret. Empty by
# default so the role stands up a Forgejo with no runners paired to it; the
# containers that exist are listed in this container's config/lxc YAML, the
# same way mosquitto's users are.
#
# Two entries must never share a secret_env. Forgejo derives a runner's UUID
# from the first 16 bytes of its secret, so identical secrets collapse into a
# single registration and the fleet quietly goes back to having one lane.
forgejo_runners: []

# The account whose token workflows use for the things the automatic per-job token
# cannot do. Its token is minted by hand and lives as an Actions secret on the forge,
# not in this repository — see docs/runbooks/post-deploy-setup.md.
forgejo_ci_user: forge-ci
forgejo_ci_email: forge-ci@home.matagoth.com
