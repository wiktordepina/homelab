---
- name: Install forgejo host dependencies
  # Forgejo shells out to git for every repository operation and to git-lfs
  # when LFS is enabled; both must be on the host PATH or the web server
  # exits during initialisation.
  ansible.builtin.apt:
    name:
      - git
      - git-lfs
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create forgejo group
  ansible.builtin.group:
    name: "{{ forgejo_group }}"
    state: present

- name: Create forgejo user
  ansible.builtin.user:
    name: "{{ forgejo_user }}"
    group: "{{ forgejo_group }}"
    home: "{{ forgejo_data_dir }}"
    shell: /bin/bash
    system: true
    create_home: false

- name: Create forgejo directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ forgejo_user }}"
    group: "{{ forgejo_group }}"
    mode: '0750'
  loop:
    - "{{ forgejo_config_dir }}"
    - "{{ forgejo_log_dir }}"
    - "{{ forgejo_data_dir }}/data"
    - "{{ forgejo_data_dir }}/data/repositories"
    - "{{ forgejo_data_dir }}/data/lfs"
    - "{{ forgejo_data_dir }}/custom"

- name: Download forgejo binary
  ansible.builtin.get_url:
    url: "https://codeberg.org/forgejo/forgejo/releases/download/v{{ forgejo_version }}/forgejo-{{ forgejo_version }}-linux-amd64"
    dest: "{{ forgejo_binary }}"
    owner: root
    group: root
    mode: '0755'
  notify: Restart forgejo service

- name: Generate the instance secrets (one-time)
  # A *_URI pointing at a file that does not exist is fatal — Forgejo reads the file,
  # it does not create one — so all four have to be in place before the service starts.
  #
  # The values come from Forgejo's own generator rather than from openssl because the
  # formats are not interchangeable: INTERNAL_TOKEN is a signed JWT and the two JWT
  # secrets are base64 of 32 raw bytes. `generate secret` does not load app.ini, so
  # this still runs on a host whose config already points at the missing files.
  ansible.builtin.shell:
    cmd: |
      umask 077
      {{ forgejo_binary }} generate secret {{ item.secret }} > {{ forgejo_config_dir }}/{{ item.file }}
      chown {{ forgejo_user }}:{{ forgejo_group }} {{ forgejo_config_dir }}/{{ item.file }}
    creates: "{{ forgejo_config_dir }}/{{ item.file }}"
  loop:
    - secret: SECRET_KEY
      file: secret_key
    - secret: INTERNAL_TOKEN
      file: internal_token
    - secret: JWT_SECRET
      file: jwt_secret
    - secret: LFS_JWT_SECRET
      file: lfs_jwt_secret
  loop_control:
    label: "{{ item.file }}"
  notify: Restart forgejo service

- name: Remove the environment file that never configured anything
  # secrets.env set FORGEJO__* variables and the unit loaded it as an EnvironmentFile.
  # Nothing ever read them: env-to-ini lives in `environment-to-ini`, a helper shipped
  # only in the container image, and the string FORGEJO__ does not appear in the server
  # binary at all. Removing it is the point of this change, not tidying after it.
  ansible.builtin.file:
    path: "{{ forgejo_config_dir }}/secrets.env"
    state: absent
  notify: Restart forgejo service

- name: Template forgejo config
  ansible.builtin.template:
    src: app.ini.j2
    dest: "{{ forgejo_config_dir }}/app.ini"
    owner: "{{ forgejo_user }}"
    group: "{{ forgejo_group }}"
    mode: '0640'
  notify: Restart forgejo service

- name: Install forgejo systemd unit
  ansible.builtin.copy:
    src: forgejo.service
    dest: /etc/systemd/system/forgejo.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart forgejo service

- name: Enable and start forgejo
  ansible.builtin.systemd_service:
    daemon_reload: true
    name: forgejo
    state: started
    enabled: true

- name: Actions CI user
  when: forgejo_actions_enabled
  block:
    # `admin user create` errors when the account already exists, so existence is
    # tested rather than the error swallowed — a create that fails for any other
    # reason should still fail the converge.
    - name: List the users
      ansible.builtin.command:
        cmd: >-
          {{ forgejo_binary }}
          --config {{ forgejo_config_dir }}/app.ini
          admin user list
        chdir: "{{ forgejo_data_dir }}"
      become: true
      become_method: ansible.builtin.su
      become_user: "{{ forgejo_user }}"
      changed_when: false
      register: forgejo_users

    # The password is random and discarded unread: this account authenticates with an
    # access token and nothing should ever sign in as it. no_log is what discards it —
    # --random-password prints the value to stdout.
    - name: Create the Actions CI user
      when: forgejo_users.stdout_lines | select('match', '\d+\s+' ~ forgejo_ci_user ~ '\s') | list | length == 0
      ansible.builtin.command:
        cmd: >-
          {{ forgejo_binary }}
          --config {{ forgejo_config_dir }}/app.ini
          admin user create
          --username {{ forgejo_ci_user }}
          --email {{ forgejo_ci_email }}
          --random-password
          --must-change-password=false
        chdir: "{{ forgejo_data_dir }}"
      become: true
      become_method: ansible.builtin.su
      become_user: "{{ forgejo_user }}"
      no_log: true
      changed_when: true

    # `admin user change-password` re-arms the must-change-password flag as a side
    # effect. An account carrying it answers 403 to every API call with a message
    # about changing the password, which reads like a token-scope problem and is not
    # one — so rotating this account's password would quietly break every workflow
    # that uses its token. Unset on each converge rather than only at creation.
    - name: Clear the must-change-password flag
      ansible.builtin.command:
        cmd: >-
          {{ forgejo_binary }}
          --config {{ forgejo_config_dir }}/app.ini
          admin user must-change-password
          --unset {{ forgejo_ci_user }}
        chdir: "{{ forgejo_data_dir }}"
      become: true
      become_method: ansible.builtin.su
      become_user: "{{ forgejo_user }}"
      changed_when: false

    - name: List the admins
      ansible.builtin.command:
        cmd: >-
          {{ forgejo_binary }}
          --config {{ forgejo_config_dir }}/app.ini
          admin user list --admin
        chdir: "{{ forgejo_data_dir }}"
      become: true
      become_method: ansible.builtin.su
      become_user: "{{ forgejo_user }}"
      changed_when: false
      register: forgejo_admins

    # Branch protection exempts admins unless a rule opts in with apply_to_admins, so
    # an admin CI user would push straight through the gates its repositories rely on
    # while the API went on reporting those gates as enforced. The account's ordinary
    # standing is the protection; assert it rather than trust it.
    - name: The Actions CI user must not be an admin
      ansible.builtin.assert:
        that:
          - forgejo_admins.stdout_lines | select('match', '\d+\s+' ~ forgejo_ci_user ~ '\s') | list | length == 0
        fail_msg: >-
          {{ forgejo_ci_user }} holds admin on this Forgejo. Remove it — admin status
          exempts the account from the branch protection its token is meant to respect.

- name: Actions runner registration
  when: forgejo_runners | length > 0
  block:
    # A missing or truncated secret would otherwise be written to disk and
    # registered, producing a runner entry that no container can ever
    # authenticate as. Check the whole list before touching anything.
    - name: Require every runner secret
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', item.secret_env) | length == 40
        fail_msg: >-
          {{ item.secret_env }} must be exported from /pve/secrets/forgejo.sh on
          the apply runner as 40 hexadecimal characters. See the create-runner
          runbook for how it is minted.
        quiet: true
      loop: "{{ forgejo_runners }}"
      loop_control:
        label: "{{ item.name }}"

    # The failure this prevents is invisible from the Forgejo side: two entries
    # sharing a secret register as one runner, so the admin list comes out a
    # runner short rather than obviously wrong.
    - name: Require each runner to have its own secret
      ansible.builtin.assert:
        that:
          - forgejo_runners | map(attribute='secret_env') | unique | list | length == forgejo_runners | length
        fail_msg: >-
          Two entries in forgejo_runners name the same secret_env. Forgejo
          derives a runner's UUID from its secret, so they would register as a
          single runner. Mint a separate secret for each.
        quiet: true

    # Handlers normally flush at the end of the play, so a failure anywhere
    # below would leave app.ini rewritten but the service never restarted —
    # and a Forgejo running against stale config rejects its own internal API
    # calls, which takes git push over SSH down with it. Restart first, so
    # nothing after this point can strand the service in that state.
    - name: Restart forgejo before registering
      ansible.builtin.meta: flush_handlers

    # Passed as a file rather than as --secret so the shared secret never
    # appears in the process table on this host.
    - name: Install the Actions runner secrets
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.env', item.secret_env) | trim }}"
        dest: "{{ forgejo_config_dir }}/runner-secret-{{ item.name }}"
        owner: "{{ forgejo_user }}"
        group: "{{ forgejo_group }}"
        mode: '0600'
      loop: "{{ forgejo_runners }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true

    # The single-runner layout kept one secret at this unsuffixed path. It is a
    # live credential, so it goes rather than being left behind.
    - name: Remove the pre-fleet runner secret
      ansible.builtin.file:
        path: "{{ forgejo_config_dir }}/runner-secret"
        state: absent

    # Offline registration rather than a one-time token pasted into the UI:
    # the runner's credentials are templated onto the runner host by the
    # forgejo_runner role, so anything registered by hand would be overwritten
    # by its next converge. Re-running with an unchanged secret re-asserts the
    # same runner and yields the same UUID, which Forgejo derives from the
    # secret's first 16 bytes — which is also why each runner needs a secret of
    # its own, asserted above.
    #
    # --keep-labels is not optional: without it the command resets the stored
    # labels to a single empty string. The runner declares its own labels.
    - name: Register the Actions runners
      ansible.builtin.command:
        cmd: >-
          {{ forgejo_binary }}
          --config {{ forgejo_config_dir }}/app.ini
          forgejo-cli actions register
          --name {{ item.name }}
          --secret-file {{ forgejo_config_dir }}/runner-secret-{{ item.name }}
          --keep-labels
        chdir: "{{ forgejo_data_dir }}"
      loop: "{{ forgejo_runners }}"
      loop_control:
        label: "{{ item.name }}"
      # su rather than the default sudo: nothing in the fleet installs sudo,
      # and the command has to run as the user that owns the SQLite database
      # so it does not leave root-owned journal files the server cannot write.
      become: true
      become_method: ansible.builtin.su
      become_user: "{{ forgejo_user }}"
      changed_when: false
