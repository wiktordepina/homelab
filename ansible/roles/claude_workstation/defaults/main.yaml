---
claude_workstation_user: agent
claude_workstation_home: /home/agent
claude_workstation_work_dir: "{{ claude_workstation_home }}/work"
claude_workstation_bin_dir: "{{ claude_workstation_home }}/.local/bin"

# The control service's account. Created here so
# the two-user split exists from the start; maitre-d itself is not installed yet.
claude_workstation_service_user: maitre-d
claude_workstation_service_home: /var/lib/maitre-d

claude_workstation_installer_url: https://claude.ai/install.sh
claude_workstation_uv_installer_url: https://astral.sh/uv/install.sh
claude_workstation_mise_installer_url: https://mise.run

# The agent's mait-code. A converge reinstalls when the installed version
# differs. Moves in lockstep with maitre-d's own pin (its uv.lock), because
# both open the same databases and refuse another schema version.
claude_workstation_mait_code_ref: v0.83.0
claude_workstation_mait_code_bootstrap_url: "https://raw.githubusercontent.com/wiktordepina/mait-code/{{ claude_workstation_mait_code_ref }}/scripts/bootstrap.sh"

claude_workstation_fj_version: "0.6.0"
claude_workstation_fj_sha256: ea559da5449b6dd7e0dd9f7ea51c906b575696f782edd606b52adcf773602742
claude_workstation_yq_version: "4.53.6"
claude_workstation_yq_sha256: c5f056448f973ae7d39b5401949648a78f2dc1947d6a8eb65be60d5c504b9385

# Forgejo on its own address and port, as the runners reach it, never through
# nginx: squid only sees the name in a CONNECT, and nginx picks a site by SNI
# and Host, so a tunnel to nginx for the forge's name reaches every site it
# fronts. Plain HTTP inside the DMZ, as for the runners.
claude_workstation_forge_host: forge.home.matagoth.com
claude_workstation_forge_ip: 10.20.1.216
claude_workstation_forge_port: 3000
claude_workstation_forge_url: "http://{{ claude_workstation_forge_host }}:{{ claude_workstation_forge_port }}"
# The name the forge's web UI shows in clone URLs. git rewrites it to the
# address above, so a URL copied from the UI works as it is.
claude_workstation_forge_public_url: https://forge.homelab.matagoth.com

# ariel (LXC 219): the agent's only way to read web pages. Reached through
# squid on its own address and port, like the forge; Claude Code's MCP client
# honours the proxy variables, plain HTTP included.
claude_workstation_ariel_host: ariel.home.matagoth.com
claude_workstation_ariel_ip: 10.20.1.219
claude_workstation_ariel_port: 8792
# /etc/claude-code/managed-mcp.json takes exclusive control: sessions get these
# servers and no others, and cannot add, change or remove one.
claude_workstation_managed_mcp:
  mcpServers:
    ariel:
      type: http
      url: "http://{{ claude_workstation_ariel_host }}:{{ claude_workstation_ariel_port }}/mcp"

claude_workstation_bot_user: matabot
claude_workstation_bot_email: matabot@noreply.matagoth.com
# From /pve/secrets/claude_workstation.sh on the apply runner. Minted by hand on
# 216 with write:repository, write:issue and read:user; see post-deploy-setup.
claude_workstation_bot_token: "{{ lookup('ansible.builtin.env', 'MATABOT_FORGE_TOKEN') }}"

# Permission rules for /etc/claude-code/managed-settings.json. With
# allowManagedPermissionRulesOnly these are the only rules in force: a session's
# "always allow" is not saved, and rules written into a repository's
# .claude/settings.json are ignored. Anything not allowed prompts.
#
# The allow list is convenience, not containment: several entries run code or
# read files by design (see the README), and no pattern list closes that.
claude_workstation_permissions_allow:
  - "Edit(/{{ claude_workstation_work_dir }}/**)"
  - "Bash(git status)"
  - "Bash(git status *)"
  - "Bash(git diff)"
  - "Bash(git diff *)"
  - "Bash(git log)"
  - "Bash(git log *)"
  - "Bash(git show *)"
  - "Bash(git branch)"
  - "Bash(git branch *)"
  - "Bash(git switch *)"
  - "Bash(git checkout *)"
  - "Bash(git restore *)"
  - "Bash(git add *)"
  - "Bash(git commit *)"
  - "Bash(git fetch)"
  - "Bash(git fetch *)"
  - "Bash(git pull)"
  - "Bash(git pull *)"
  - "Bash(git push)"
  - "Bash(git push *)"
  - "Bash(git stash)"
  - "Bash(git stash *)"
  - "Bash(git rev-parse *)"
  - "Bash(git remote -v)"
  - "Bash(fj *)"
  - "Bash(uv sync)"
  - "Bash(uv sync *)"
  - "Bash(uv run pytest *)"
  - "Bash(uv run ruff *)"
  - "Bash(mise install)"
  - "Bash(mise install *)"
  - "Bash(mc-tool-board *)"
  - "Bash(mc-tool-memory *)"
  - "Bash(mc-tool-reminders *)"
  - "Bash(mc-tool-inbox *)"
  - "Bash(ls *)"
  - "Bash(cat *)"
  - "Bash(head *)"
  - "Bash(tail *)"
  - "Bash(wc *)"
  - "Bash(grep *)"
  - "Bash(rg *)"
  - "Bash(jq *)"
  - "Bash(yq *)"
  - "Bash(pwd)"
  # The search runs on Anthropic's side, so it needs nothing beyond the API on
  # the egress allowlist.
  - "WebSearch"
  # Pages are read through ariel, by id, never by URL.
  - "mcp__ariel"
claude_workstation_permissions_deny:
  # --safe-mode drops the managed CLAUDE.md (the agent's identity), and nothing
  # here needs a session to start another.
  - "Bash(claude)"
  - "Bash(claude *)"
  - "Read(~/.ssh/**)"
  - "Read(~/.git-credentials)"
  - "Read(~/.local/share/forgejo-cli/**)"
  - "Read(~/.claude/.credentials.json)"
  - "Read(//**/.env)"
  - "Read(//**/*.env)"
  # Any fetch can carry data out in its URL. ariel is the way to read pages.
  - "WebFetch"

claude_workstation_managed_settings:
  # For the Bash tool's children as much as for Claude Code itself; the .bashrc
  # block sets the same for shells that do not come from a session.
  env: "{{ claude_workstation_proxy_env }}"
  disableClaudeAiConnectors: true
  allowManagedPermissionRulesOnly: true
  allowManagedHooksOnly: true
  permissions:
    disableBypassPermissionsMode: disable
    allow: "{{ claude_workstation_permissions_allow }}"
    deny: "{{ claude_workstation_permissions_deny }}"
  hooks:
    PreToolUse:
      - matcher: Bash
        hooks:
          - type: command
            command: "/usr/bin/jq -c '{session_id, cwd, command: .tool_input.command}' | /usr/bin/logger -t claude-code-audit"
    # mait-code declares these in its config/settings.json, which `mait-code
    # install` merges into the user settings, where allowManagedHooksOnly ignores
    # them. Keep commands, timeouts and async in step with that file at the
    # pinned ref.
    SessionStart:
      - hooks:
          - type: command
            command: "{{ claude_workstation_bin_dir }}/mc-hook-session-start"
            timeout: 10
    PreCompact:
      - hooks:
          - type: command
            command: "{{ claude_workstation_bin_dir }}/mc-hook-observe --trigger precompact"
            timeout: 60
            async: true
    SessionEnd:
      - hooks:
          - type: command
            command: "{{ claude_workstation_bin_dir }}/mc-hook-observe --trigger session-end"
            timeout: 60
            async: true

# Built from the observation record (post-deploy-setup, step 5): a few days of
# sessions, plus the installers and a mise/uv/npm workflow run as the agent in a
# throwaway home. Squid's access log shows what is refused from here on.
claude_workstation_egress_enforce: true
claude_workstation_egress_allowlist:
  - "{{ claude_workstation_forge_host }}"
  - "{{ claude_workstation_ariel_host }}"
  # Claude Code: the API, the login, the installer and its self-updates
  - api.anthropic.com
  - platform.claude.com
  - claude.ai
  - downloads.claude.ai
  # uv, and the Python packages it syncs
  - astral.sh
  - releases.astral.sh
  - pypi.org
  - files.pythonhosted.org
  # mise, and the toolchains it installs
  - mise.run
  - mise.jdx.dev
  - mise-versions.jdx.dev
  - tuf-repo-cdn.sigstore.dev
  - nodejs.org
  - registry.npmjs.org
  # mait-code's bootstrap and git source; mise's release downloads
  - github.com
  - raw.githubusercontent.com
  - release-assets.githubusercontent.com
  # mait-code's embedding model, on first use after a rebuild. The download
  # CDN's name varies, hence the whole of hf.co.
  - huggingface.co
  - .hf.co

claude_workstation_proxy_url: http://127.0.0.1:3128
claude_workstation_proxy_env:
  HTTP_PROXY: "{{ claude_workstation_proxy_url }}"
  HTTPS_PROXY: "{{ claude_workstation_proxy_url }}"
  http_proxy: "{{ claude_workstation_proxy_url }}"
  https_proxy: "{{ claude_workstation_proxy_url }}"
  NO_PROXY: localhost,127.0.0.1
  no_proxy: localhost,127.0.0.1

# Who may open SSH to the workstation. Everything else inbound is refused.
claude_workstation_ssh_sources:
  - { addr: 10.10.10.40, comment: laptop }
  - { addr: 10.100.10.10, comment: desktop }
  - { addr: 10.20.6.0/24, comment: apply runners (600-699) }
  # run/host-key-push installs keys from PVE
  - { addr: 192.168.200.100, comment: PVE }
claude_workstation_ingress_nft_file: /etc/nftables.d/ingress.nft

# maitre-d's port (its MCP server and web UI share it). Open inbound to the
# reverse proxy alone, which limits the UI to the laptop and the desktop; the
# agent is refused it outright.
claude_workstation_service_port: 8790
claude_workstation_service_sources:
  - 10.20.1.10

# node_exporter, open to Prometheus alone.
claude_workstation_metrics_port: 9100
claude_workstation_metrics_sources:
  - 10.20.1.210

# The session units (claude-rc@, claude-job@, claude-snap@). Projects listed
# here get a Remote Control server at boot; any other checkout under the work
# directory can be started on demand.
claude_workstation_rc_projects: []
claude_workstation_rc_capacity: 2
claude_workstation_unit_memory_max: 3G
claude_workstation_slice_memory_max: 6G
# The longest workflow's limit; maitre-d stops a job at its own workflow's.
claude_workstation_job_runtime_max: 6h
claude_workstation_job_cpu_quota: 200%
claude_workstation_snap_lines: 200
# Outside /tmp, which every unit gets a private copy of, so a snapshot unit and
# an SSH shell find the same tmux sockets as the server unit.
claude_workstation_tmux_dir: /run/claude-tmux
claude_workstation_jobs_dir: "{{ claude_workstation_service_home }}/jobs"
# maitre-d's workflow runner, which claude-job@ runs. Installed by the maitre_d
# role from its pinned release.
claude_workstation_job_runner_dir: /opt/maitre-d-runner
claude_workstation_snaps_dir: "{{ claude_workstation_service_home }}/snaps"
