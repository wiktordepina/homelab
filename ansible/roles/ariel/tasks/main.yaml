---
- name: Require the secrets
  ansible.builtin.assert:
    that:
      - ariel_forge_token is match('^[0-9a-f]{40}$')
      - ariel_litellm_key is match('^sk-')
      - ariel_searxng_secret | length >= 32
    fail_msg: >-
      ARIEL_FORGE_TOKEN, ARIEL_LITELLM_KEY and ARIEL_SEARXNG_SECRET must be
      exported from /pve/secrets/ariel.sh on the apply runner. See
      post-deploy-setup for how each is made.
    quiet: true
  no_log: true

- name: Template the ingress ruleset
  ansible.builtin.template:
    src: ingress.nft.j2
    dest: "{{ ariel_ingress_nft_file }}"
    owner: root
    group: root
    mode: '0644'
    validate: nft -c -f %s
  notify: Reload ingress firewall

- name: Install the ingress firewall unit
  ansible.builtin.template:
    src: ingress-firewall.service.j2
    dest: /etc/systemd/system/ingress-firewall.service
    owner: root
    group: root
    mode: '0644'
  notify: Reload ingress firewall

# Started before anything listens, and flushed now rather than at the end, so
# the published ports are never open unfenced.
- name: Enable and start the ingress firewall
  ansible.builtin.systemd_service:
    name: ingress-firewall
    daemon_reload: true
    state: started
    enabled: true

- name: Apply a changed ingress ruleset
  ansible.builtin.meta: flush_handlers

- name: Create the install directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - "{{ ariel_install_dir }}"
    - "{{ ariel_install_dir }}/searxng"

- name: Read the deployed commit
  ansible.builtin.slurp:
    src: "{{ ariel_src_dir }}/.commit"
  register: ariel_deployed
  failed_when: false

# Cloned on the apply runner, checked against the pinned commit there, and
# shipped as an archive: this host never reaches the forge. The token goes in
# through git's environment, never argv and never the remote URL.
- name: Ship the pinned release
  when: (ariel_deployed.content | default('') | b64decode | trim) != ariel_commit
  block:
    - name: Create a scratch directory on the runner
      ansible.builtin.tempfile:
        state: directory
        suffix: -ariel
      delegate_to: localhost
      become: false
      register: ariel_scratch

    - name: Clone the release tag on the runner
      ansible.builtin.command:
        argv:
          - git
          - clone
          - --quiet
          - --depth=1
          - "--branch=v{{ ariel_version }}"
          - "{{ ariel_repo_url }}"
          - "{{ ariel_scratch.path }}/src"
      environment:
        GIT_CONFIG_COUNT: '1'
        GIT_CONFIG_KEY_0: http.extraHeader
        GIT_CONFIG_VALUE_0: "Authorization: token {{ ariel_forge_token }}"
      delegate_to: localhost
      become: false
      no_log: true
      changed_when: false

    - name: Check the clone is the pinned commit
      ansible.builtin.command:
        argv: [git, -C, "{{ ariel_scratch.path }}/src", rev-parse, HEAD]
      delegate_to: localhost
      become: false
      register: ariel_clone_head
      changed_when: false
      failed_when: ariel_clone_head.stdout != ariel_commit

    - name: Archive the release on the runner
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ ariel_scratch.path }}/src"
          - archive
          - --format=tar.gz
          - "--output={{ ariel_scratch.path }}/ariel.tar.gz"
          - HEAD
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Remove the previous tree
      ansible.builtin.file:
        path: "{{ ariel_src_dir }}"
        state: absent

    - name: Create the source directory
      ansible.builtin.file:
        path: "{{ ariel_src_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Unpack the release
      ansible.builtin.unarchive:
        src: "{{ ariel_scratch.path }}/ariel.tar.gz"
        dest: "{{ ariel_src_dir }}"
        owner: root
        group: root

    # Written last, so a run that died part-way ships the tree again.
    - name: Record the deployed commit
      ansible.builtin.copy:
        content: "{{ ariel_commit }}\n"
        dest: "{{ ariel_src_dir }}/.commit"
        owner: root
        group: root
        mode: '0644'

  always:
    - name: Remove the scratch directory on the runner
      ansible.builtin.file:
        path: "{{ ariel_scratch.path }}"
        state: absent
      delegate_to: localhost
      become: false
      when: ariel_scratch.path is defined

- name: Read the built image's commit
  ansible.builtin.command:
    argv:
      - docker
      - image
      - inspect
      - --format
      - '{{ "{{" }} index .Config.Labels "org.opencontainers.image.revision" {{ "}}" }}'
      - "{{ ariel_image }}"
  register: ariel_built
  changed_when: false
  failed_when: false

# Built here, where the open web is, through squid: the build's RUN steps are
# Docker clients like the containers, and pull Python packages from PyPI.
- name: Build the image
  ansible.builtin.command:
    argv:
      - docker
      - build
      - --pull
      - "--build-arg=HTTP_PROXY={{ ariel_proxy_url }}"
      - "--build-arg=HTTPS_PROXY={{ ariel_proxy_url }}"
      - "--label=org.opencontainers.image.revision={{ ariel_commit }}"
      - "--label=org.opencontainers.image.version={{ ariel_version }}"
      - "--tag={{ ariel_image }}"
      - "{{ ariel_src_dir }}"
  when: ariel_built.stdout | trim != ariel_commit
  changed_when: true

- name: Template ariel's configuration
  ansible.builtin.template:
    src: ariel.toml.j2
    dest: "{{ ariel_install_dir }}/ariel.toml"
    owner: root
    group: root
    mode: '0644'
  register: ariel_config

# The release's SearXNG settings, with the one thing that differs on this host:
# every outgoing request goes through squid.
- name: Read the release's SearXNG settings
  ansible.builtin.slurp:
    src: "{{ ariel_src_dir }}/deploy/searxng/settings.yml"
  register: ariel_searxng_release_settings

- name: Write SearXNG's settings
  ansible.builtin.copy:
    content: >-
      {{ ariel_searxng_release_settings.content | b64decode | from_yaml
         | combine({'outgoing': {'proxies': {'all://': [ariel_proxy_url]}}}, recursive=true)
         | to_nice_yaml(indent=2) }}
    dest: "{{ ariel_install_dir }}/searxng/settings.yml"
    owner: root
    group: root
    mode: '0644'
  register: ariel_searxng_config

- name: Write the secrets for compose
  ansible.builtin.template:
    src: env.j2
    dest: "{{ ariel_install_dir }}/.env"
    owner: root
    group: root
    mode: '0600'
  no_log: true

- name: Template the compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ ariel_install_dir }}/compose.yaml"
    owner: root
    group: root
    mode: '0644'

# up recreates a container whose image or definition changed; a changed mounted
# file is not a changed definition, so the configuration is checked separately.
- name: Start the stack
  community.docker.docker_compose_v2:
    project_src: "{{ ariel_install_dir }}"
    state: present
    remove_orphans: true

- name: Restart the services whose mounted configuration changed
  community.docker.docker_compose_v2:
    project_src: "{{ ariel_install_dir }}"
    state: restarted
    services: >-
      {{ (['ariel'] if ariel_config is changed else [])
         + (['searxng'] if ariel_searxng_config is changed else []) }}
  when: ariel_config is changed or ariel_searxng_config is changed

- name: Wait for ariel to report the pinned version
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ ariel_mcp_port }}/healthz"
    return_content: true
  register: ariel_health
  until: ariel_health.status == 200 and ariel_health.json.version == ariel_version
  retries: 20
  delay: 3
