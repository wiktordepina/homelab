name: PVE Extras

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - config/pve/playbook.yaml

concurrency: ansible-pve

jobs:
  PVE:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run PVE Extras playbook
        run: ./run/execute_runner ansible_pve
