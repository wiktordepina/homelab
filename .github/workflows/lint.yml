name: Lint

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

# Lint needs the source tree and nothing else, so it runs on GitHub-hosted
# runners. Keeping it off the self-hosted apply runner means a pushed branch
# cannot execute code next to /pve/secrets, and cannot retag the
# runner-toolbox:latest image that the apply workflows run.
permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - name: Build runner-toolbox image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: runner-toolbox
          tags: runner-toolbox:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run linters
        run: ./run/lint
